name: iOS

on:
  # Private repo: macOS minutes bill at 10x and the free allowance is small, so
  # this runs once per ready-for-review PR change, not on drafts, docs-only
  # changes, or again on main after a merge (the PR head was already tested).
  # Run it by hand from the Actions tab when you need a main build.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".agents/**"
      - ".github/dependabot.yml"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

# The jobs only check out code and upload logs, so the token needs no write access.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Riverhead NY Budget App.xcodeproj
  SCHEME: Riverhead NY Budget App
  UI_BUNDLE: Riverhead NY Budget AppUITests

jobs:
  # Compile plus the unit suite. This is the job that matters: every one of the
  # four compile errors fixed on the parity branch would have been caught here,
  # at PR time, months before anyone opened Xcode.
  build-and-unit-test:
    name: Build + unit tests
    # Skip drafts, and skip label events other than the opt-in "ui-tests" label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       (github.event.action != 'labeled' || github.event.label.name == 'ui-tests'))
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select and warm up Xcode
        run: bash .github/scripts/select-xcode.sh

      - name: Pick a simulator destination
        id: dest
        run: |
          set -euo pipefail
          udid="$(bash .github/scripts/pick-destination.sh "$PROJECT" "$SCHEME")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Simulator: $udid"

      - name: Boot the simulator
        run: bash .github/scripts/boot-simulator.sh "${{ steps.dest.outputs.udid }}"

      - name: Build and run unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.dest.outputs.udid }}" \
            -skip-testing:"$UI_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee unit.log

      # Runs even when the build fails: a red run should explain itself in the
      # check summary rather than making the next reader scroll a 20k-line log.
      # Three of the four compile errors on this branch were misdiagnosed
      # because the tail of the log was sampled instead of the `error:` lines.
      - name: Summarise
        if: always()
        run: bash .github/scripts/summarise.sh unit.log "Unit run" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-log
          path: unit.log
          retention-days: 7
          if-no-files-found: ignore

  # Split out because it is the expensive half: the UI bundle spends roughly two
  # minutes booting and driving a simulator for 4 tests, against 0.3s for 47
  # unit tests, and it was half of this repo's macOS bill. It is opt-in: add the
  # "ui-tests" label to a PR (or run the workflow by hand) when a change touches
  # UI flows. It waits for the unit job so a broken build is not paid for twice.
  ui-test:
    name: UI tests
    needs: build-and-unit-test
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ui-tests')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select and warm up Xcode
        run: bash .github/scripts/select-xcode.sh

      - name: Pick a simulator destination
        id: dest
        run: |
          set -euo pipefail
          udid="$(bash .github/scripts/pick-destination.sh "$PROJECT" "$SCHEME")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator
        run: bash .github/scripts/boot-simulator.sh "${{ steps.dest.outputs.udid }}"

      - name: Run UI tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -only-testing:"$UI_BUNDLE" \
            -destination "id=${{ steps.dest.outputs.udid }}" \
            -resultBundlePath ui.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ui.log

      - name: Summarise
        if: always()
        run: bash .github/scripts/summarise.sh ui.log "UI run" >> "$GITHUB_STEP_SUMMARY"

      # The result bundle carries the failure screenshots. Worth the storage:
      # a picture of the screen at the moment of the assertion is exactly what
      # was missing while these tests were being debugged blind.
      - name: Upload logs and result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-logs
          path: |
            ui.log
            ui.xcresult
          retention-days: 7
          if-no-files-found: ignore
